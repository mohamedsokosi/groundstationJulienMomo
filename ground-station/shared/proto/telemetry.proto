syntax = "proto3";

package groundstation.telemetry.v1;

message TelemetryFrame {
  uint32 sequence_number = 1;
  string mission_time = 2;
  string flight_id = 3;
  string gnss_time_utc = 4;
  double latitude_deg = 5;
  double longitude_deg = 6;
  double altitude_m = 7;
  double speed_mps = 8;
  double vertical_speed_mps = 9;
  uint32 satellite_count = 10;
  double pressure_hpa = 11;
  double miu_v = 12;
  double temperature_1_c = 13;
  double temperature_2_c = 14;
  double temperature_3_c = 15;
  double temperature_4_c = 16;
  double temperature_5_c = 17;
  double temperature_6_c = 18;
  double temperature_7_c = 19;
  double temperature_8_c = 20;
}

message TelemetryBatch {
  uint32 schema_version = 1;
  repeated TelemetryFrame frames = 2;
}
